name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies for main library
        run: npm ci

      - name: Build main library
        run: npm run build

      - name: Setup npm link
        run: npm link

      - name: Install dependencies for web
        run: |
          cd web
          npm ci

      - name: Link local cue-parser
        run: |
          cd web
          npm link cue-parser

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Build with Next.js
        run: |
          cd web
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out

      # melocil.de/cue-parser 用: ビルド済みの静的サイトを web-dist ブランチに公開する。
      # melocil.de-site 側はこのブランチの tarball を out/cue-parser/ に展開して配信する。
      - name: Publish static export to web-dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd web/out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: web static export from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:web-dist

      # melocil.de-site のビルドを起動して melocil.de/cue-parser を更新する。
      # SITE_DISPATCH_TOKEN (melocil.de-site への contents:write を持つ PAT) が未設定ならスキップする。
      - name: Trigger melocil.de-site rebuild
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; skipping dispatch."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MaxMEllon/melocil.de-site/dispatches \
            -d '{"event_type":"cue-parser-updated"}'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4